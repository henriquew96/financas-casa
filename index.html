<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f1f1d'/%3E%3Cpath d='M8 15l8-7 8 7v9H8z' fill='none' stroke='%23fcfcfb' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='19' r='2.6' fill='%231baf7a'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f3f3f1;--card:#fcfcfb;--tx:#0b0b0b;--tx2:#52514e;--tx3:#76756f;--linha:#e3e2de;--linha2:#d2d1cb;
  --ink:#1f1f1d;--ink-tx:#fcfcfb;--suave:#ecebe7;
  --s-fixas:#2a78d6;--s-var:#eb6834;--s-livre:#1baf7a;--s-neutro:#8b8a85;
  --bom:#0ca30c;--critico:#d03b3b;--critico-tx:#b42323;
  --raio:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110;--card:#1a1a19;--tx:#f0efec;--tx2:#c3c2b7;--tx3:#8f8e88;--linha:#2c2c2a;--linha2:#3b3b38;
    --ink:#f0efec;--ink-tx:#111110;--suave:#252523;
    --s-fixas:#3987e5;--s-var:#d95926;--s-livre:#199e70;--s-neutro:#8f8e88;--critico-tx:#ef7676;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110;--card:#1a1a19;--tx:#f0efec;--tx2:#c3c2b7;--tx3:#8f8e88;--linha:#2c2c2a;--linha2:#3b3b38;
  --ink:#f0efec;--ink-tx:#111110;--suave:#252523;
  --s-fixas:#3987e5;--s-var:#d95926;--s-livre:#199e70;--s-neutro:#8f8e88;--critico-tx:#ef7676;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{text-wrap:balance}
.topo{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--linha)}
.topo-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.marca{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:16px}
.marca svg{width:30px;height:30px;flex:none}
.mesnav{display:flex;align-items:center;gap:4px}
.mesnav .ico{width:38px;height:38px;border-radius:10px;border:1px solid var(--linha2);background:var(--card);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.mesnav .ico:hover{background:var(--suave)}
.mes-rot{border:0;background:none;cursor:pointer;padding:2px 6px;text-align:center;min-width:136px;border-radius:8px}
.mes-rot:hover{background:var(--suave)}
.mes-rot b{display:block;font-size:15px;text-transform:capitalize}
.mes-rot small{display:block;font-size:11.5px;color:var(--tx3)}
.abas{max-width:1040px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.abas button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;font-weight:550;white-space:nowrap}
.abas button svg{width:18px;height:18px;flex:none}
.abas button:hover{color:var(--tx)}
.abas button[aria-current="page"]{color:var(--tx);border-bottom-color:var(--tx)}
main{max-width:1040px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px;min-width:0}
.card h2{margin:0 0 6px;font-size:21px;letter-spacing:-.015em}
.card h3{margin:0 0 12px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h3 .muted{font-weight:500;font-size:13.5px}
.sub{color:var(--tx2);font-size:13.5px;margin:0}
.muted{color:var(--tx3)}
.neg{color:var(--critico-tx)}
.cred{color:var(--tx2)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.dois{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpi .rot{font-size:12.5px;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:4px 0 8px}
.kpi .det{font-size:12.5px;color:var(--tx2);display:flex;flex-direction:column;gap:3px}
.kpi .det span{display:flex;justify-content:space-between;gap:8px}
.kpi .det b{color:var(--tx);font-weight:600}
.ponto{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.traco{width:16px;height:0;border-top:2px dashed var(--tx);display:inline-block}
.c-fixas{background:var(--s-fixas)}.c-var{background:var(--s-var)}.c-livre{background:var(--s-livre)}
/* destaque */
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero .rot{font-size:13px;color:var(--tx2);font-weight:600}
.hero-num{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
.barra-comp{position:relative;display:flex;gap:2px;height:14px;margin:16px 0 10px}
.barra-comp .seg{display:block;height:100%;min-width:3px}
.barra-comp .seg:first-of-type{border-radius:4px 0 0 4px}
.barra-comp .seg:last-of-type{border-radius:0 4px 4px 0}
.barra-comp .seg:only-of-type{border-radius:4px}
.barra-comp i{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--tx)}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--tx2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg b{color:var(--tx);font-weight:600}
/* projeção */
.proj{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.proj-col{display:flex;flex-direction:column;gap:4px;border-radius:10px;padding:6px 2px;outline:none;cursor:default}
.proj-col:hover,.proj-col:focus-visible{background:var(--suave)}
.proj-area{position:relative;height:150px}
.proj-pilha{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(46px,72%);height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.proj-pilha .seg{display:block;width:100%}
.proj-pilha .seg:first-child{border-radius:4px 4px 0 0}
.proj-renda{position:absolute;left:6%;right:6%;height:0;border-top:2px dashed var(--tx)}
.proj-mes{text-align:center;font-size:12px;color:var(--tx2)}
.proj-sobra{text-align:center;font-size:12px;font-weight:650;white-space:nowrap}
/* barras horizontais */
.hbar{display:grid;grid-template-columns:minmax(84px,138px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:4px 0}
.hb-rot{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-trilho{height:10px;background:var(--suave);border-radius:0 4px 4px 0;overflow:hidden}
.hb-barra{display:block;height:100%;background:var(--s-neutro);border-radius:0 4px 4px 0;min-width:2px}
.hb-val{color:var(--tx2);font-size:12.5px;white-space:nowrap}
.medidor{height:8px;background:var(--suave);border-radius:4px;overflow:hidden;margin:2px 0 6px}
.medidor span{display:block;height:100%;background:var(--s-neutro);border-radius:0 4px 4px 0}
.medidor.estouro span{background:var(--critico)}
/* listas */
.lista{display:flex;flex-direction:column}
.linha{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border:0;border-bottom:1px solid var(--linha);background:none;text-align:left;cursor:pointer;width:100%;border-radius:0}
.linha:hover{background:var(--suave)}
.linha:last-child{border-bottom:0}
.linha.inativo,.linha.passou{opacity:.6}
.l-ico{width:38px;height:38px;border-radius:10px;background:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--tx2);line-height:1.05}
.l-ico small{font-size:10px;font-weight:550;color:var(--tx3)}
.l-desc b{display:block;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-desc small{display:block;color:var(--tx3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-valor{font-weight:600;white-space:nowrap;text-align:right}
.l-valor small{display:block;font-weight:400;color:var(--tx3);font-size:12px}
.grupo{font-size:11.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;padding:16px 6px 4px}
.grupo:first-child{padding-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--suave);color:var(--tx2);vertical-align:1px;white-space:nowrap}
.vazio{padding:28px 12px;text-align:center;color:var(--tx3)}
.pessoa-cab{font-size:12.5px;font-weight:650;color:var(--tx2);padding:10px 6px 2px}
/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linha2);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:550;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--suave)}
.btn.primario{background:var(--ink);color:var(--ink-tx);border-color:var(--ink)}
.btn.primario:hover{opacity:.88}
.btn.perigo{color:var(--critico-tx)}
.btn.peq{padding:4px 10px;font-size:13px;min-height:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--tx);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:600}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--linha2);background:var(--card);border-radius:10px;padding:8px 11px;min-height:40px}
textarea{resize:vertical;min-height:80px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.proj-col:focus-visible{outline:2px solid var(--tx);outline-offset:1px}
.ferr{display:flex;flex-wrap:wrap;gap:8px}
.ferr input[type=search]{flex:2 1 200px;width:auto}
.ferr select{flex:1 1 150px;width:auto}
.seg-ctl{display:inline-flex;border:1px solid var(--linha2);border-radius:11px;padding:2px;gap:2px;background:var(--bg);flex-wrap:wrap}
.seg-ctl button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:550;color:var(--tx2);font-size:13.5px}
.seg-ctl button[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.aviso{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--suave);border:1px solid var(--linha);border-radius:12px;padding:10px 14px;font-size:13.5px}
.botoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.linha-add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.linha-add input{flex:2 1 180px;width:auto}
.linha-add select{flex:1 1 150px;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--linha2);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px;min-height:30px}
.chip:not(:has(button)){padding-right:11px}
.chip button{border:0;background:none;cursor:pointer;color:var(--tx3);width:24px;height:24px;border-radius:50%;font-size:15px;line-height:1}
.chip button:hover{background:var(--suave);color:var(--tx)}
.regras{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.regra{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center}
.regra code{font:13px/1.3 ui-monospace,Consolas,monospace;background:var(--suave);padding:6px 8px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.regra select{min-height:34px;padding:4px 8px}
.fases{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--tx2)}
.fases b{color:var(--tx)}
/* boas-vindas */
.passos{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.passos li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--linha);border-radius:12px}
.passos .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--suave);font-weight:700}
.passos li.ok .n{background:var(--bom);color:#fff}
/* importação */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--linha2);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.sobre{border-color:var(--tx);background:var(--suave)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
details summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin:12px 0;align-items:end}
.lbl{font-size:12.5px;font-weight:600;color:var(--tx2)}
.tab-wrap{overflow:auto;border:1px solid var(--linha);border-radius:12px;max-height:62vh}
table.prev{border-collapse:collapse;width:100%;font-size:13.5px;min-width:660px}
table.prev th{position:sticky;top:0;z-index:1;background:var(--suave);text-align:left;font-size:12px;color:var(--tx2);font-weight:650;padding:8px}
table.prev td{border-top:1px solid var(--linha);padding:6px 8px;vertical-align:middle}
table.prev tr.off td{color:var(--tx3)}
table.prev tr.off .tag{color:var(--tx2)}
table.prev select{min-height:32px;padding:3px 8px;font-size:13px;width:auto;max-width:170px}
.num{text-align:right;white-space:nowrap}
/* formulário */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--tx);box-shadow:0 24px 64px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(0,0,0,.42)}
.form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form h2{grid-column:1/-1;margin:0;font-size:18px}
.form .info,.form .erro{grid-column:1/-1;margin:0}
.form .erro{color:var(--critico-tx);font-size:13.5px;font-weight:600}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.largo,.form .campo.chk,.acoes-form{grid-column:1/-1}
.campo>label{font-size:12.5px;font-weight:600;color:var(--tx2)}
.campo.chk{flex-direction:row;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.campo.chk input{width:18px;height:18px;flex:none}
.dica{color:var(--tx3);font-size:12px}
.dica:empty{display:none}
.dinheiro{display:flex;align-items:center;border:1px solid var(--linha2);border-radius:10px;background:var(--card);padding-left:11px}
.dinheiro:focus-within{outline:2px solid var(--tx);outline-offset:1px}
.dinheiro span{color:var(--tx3);font-size:14px}
.dinheiro input{border:0!important;min-height:38px;outline:none!important;background:none!important}
.acoes-form{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.acoes-form .sp{flex:1}
/* nuvem e login */
.erro{color:var(--critico-tx);font-size:13.5px;font-weight:600;margin:0}
.nuvem{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);border:1px solid var(--linha);border-radius:999px;padding:3px 10px;background:var(--card);white-space:nowrap;margin-left:auto;cursor:pointer}
.nuvem i{font-style:normal;font-weight:800}
.nuvem.ok i{color:var(--bom)}.nuvem.off i{color:#c98500}.nuvem.erro i{color:var(--critico)}.nuvem.and i{color:var(--tx3)}
.entrar{max-width:620px;margin:20px auto;width:100%}
.form-entrar{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.form-entrar .btn.primario{align-self:flex-start}
.sub-card{background:var(--bg);display:flex;flex-direction:column;gap:12px}
.sub-card h3{margin:0}
.ok-msg{color:var(--tx);background:var(--suave);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0}
.codigo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.codigo code{font:650 20px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.08em;background:var(--suave);padding:8px 12px;border-radius:10px}
.det-lista{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px}
.det-lista span{color:var(--tx2)}
.det-lista b{font-weight:600;overflow-wrap:anywhere}
/* flutuantes */
.fab{position:fixed;right:max(16px,calc((100vw - 1040px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--ink-tx);font-size:30px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer;z-index:25}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--ink-tx);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--card);color:var(--tx);border:1px solid var(--linha2);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.16);white-space:pre-line;opacity:0;transition:opacity .1s;max-width:250px;left:0;top:0}
#tip.on{opacity:1}
@media (min-width:720px){.fab{bottom:28px}#toast{bottom:28px}}
@media (max-width:719px){
  body{font-size:15px}
  input,select,textarea{font-size:16px!important}
  .marca span{display:none}
  .nuvem span{display:none}
  .nuvem{padding:3px 8px;margin-right:2px}
  .topo{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)} /* o desfoque prenderia a barra fixa de abas dentro do cabeçalho */
  .abas{position:fixed;left:0;right:0;bottom:0;max-width:none;background:var(--card);border-top:1px solid var(--linha);padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30;gap:2px}
  .abas button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;border-bottom:0;border-radius:10px;min-width:0}
  .abas button[aria-current="page"]{background:var(--suave)}
  .hero-num{font-size:34px}
  .proj{gap:2px}
  .proj-sobra{font-size:11px;letter-spacing:-.02em}
  .proj-sobra .rs{display:none}
  .form{grid-template-columns:1fr}
  .hbar{grid-template-columns:minmax(76px,110px) minmax(0,1fr) auto}
}
@media print{.topo,.abas,.fab{display:none}body{padding:0;background:#fff}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><path d="M8 15l8-7 8 7v9H8z" fill="none" stroke="var(--ink-tx)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="19" r="2.6" fill="var(--s-livre)"/></svg>
      <span>Finanças da Casa</span>
    </div>
    <button class="nuvem" id="nuvem" hidden data-acao="ver-conta" aria-live="polite"><i>✓</i><span>Sincronizado</span></button>
    <div class="mesnav" role="group" aria-label="Mês">
      <button class="ico" data-acao="mes" data-d="-1" aria-label="Mês anterior">‹</button>
      <button class="mes-rot" data-acao="mes-hoje" title="Voltar para o mês atual" id="mesRot"></button>
      <button class="ico" data-acao="mes" data-d="1" aria-label="Próximo mês">›</button>
    </div>
  </div>
  <nav class="abas" id="abas" aria-label="Seções">
    <button data-aba="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Painel</button>
    <button data-aba="lancamentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>Lançamentos</button>
    <button data-aba="importar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>Importar</button>
    <button data-aba="cadastros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10.5h18M15.5 15h2.5M6 6V5.5A2.5 2.5 0 018.5 3H16"/></svg>Cadastros</button>
    <button data-aba="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Ajustes</button>
  </nav>
</header>
<main id="app"></main>
<button class="fab" id="fab" data-acao="novo-lanc" aria-label="Novo lançamento" title="Novo lançamento">+</button>
<dialog id="modal"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
